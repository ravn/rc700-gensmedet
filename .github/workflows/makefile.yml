name: Makefile CI

# Disabled: Legacy zmac compilation fails on GCC 14 (Ubuntu 24.04 runner)
# due to C23 strict prototypes in legacy zmac.y (e.g. void bookmark();).
# Kept as manual workflow_dispatch if someone wants to test or fix.
on:
  workflow_dispatch:

jobs:
  build:
    if: false
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: compile zmac
      run: make -C zmac

    - name: assemble PROM
      run: make CMP_FLAGS=-l -C roa375 all

    - name: assemble RC700 SYSGEN
      run: make -C sysgen
